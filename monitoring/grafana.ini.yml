apiVersion: 1

datasources:

  - name: Prometheus

    type: prometheus

    access: proxy

    url: http://prometheus.neonlens.internal:9090

    isDefault: true

    editable: false

  - name: CloudWatch
    
    type: cloudwatch
    
    access: proxy
    
    jsonData:
      authType: default
      defaultRegion: ${aws_region}
    
    editable: false