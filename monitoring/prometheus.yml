global:
  scrape_interval: 15s
  evaluation_interval: 15s

  external_labels:
    environment: ${environment}
    service: neonlens

rule_files:
  - /etc/prometheus/backend.rules.yml
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Direct application metrics
  - job_name: neonlens-backend
    metrics_path: /metrics

    dns_sd_configs:
      - names:
          - backend.neonlens.internal
        type: A
        port: 3000

    relabel_configs:
      - source_labels: [__meta_dns_name]
        target_label: service
        replacement: backend

  # HTTP availability probes through each backend task's sidecar
  - job_name: neonlens-blackbox
    metrics_path: /probe

    params:
      module: [http_2xx]

    dns_sd_configs:
      - names:
          - backend.neonlens.internal
        type: A
        port: 9115

    relabel_configs:
      # Probe the backend on the same task's private IP
      - source_labels: [__address__]
        regex: '(.+):9115'
        target_label: __param_target
        replacement: 'http://$1:3000/'

      # Identify the probed backend in Prometheus
      - source_labels: [__param_target]
        target_label: instance

      - target_label: service
        replacement: backend
